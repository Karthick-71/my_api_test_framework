[project]
name = "api-test-framework"
version = "2.0.0"
description = "Data-driven REST API test automation with Pytest, Excel test cases and cross-build test history"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "-p", "framework.reporting.triage_junit",
    "--junitxml=reports/junit.xml",
    "--triage-junit=reports/junit-triage.xml",
    "--html=reports/report.html",
    "--self-contained-html",
]
junit_family = "xunit2"
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
markers = [
    "smoke: fast checks that the service is up and core flows work",
    "regression: full functional coverage",
    "contract: response shape and headers",
    "perf: response-time budgets",
    "unit: framework code, no running API needed",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "UP045"]  # keep Optional[...] readable on Python 3.9

[tool.ruff.lint.isort]
known-first-party = ["framework", "sut"]
